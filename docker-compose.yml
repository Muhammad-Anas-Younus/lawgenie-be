services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawgenie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawgenie}
      POSTGRES_DB: ${POSTGRES_DB:-lawgenie}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lawgenie} -d ${POSTGRES_DB:-lawgenie}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8000:8000"

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lawgenie}:${POSTGRES_PASSWORD:-lawgenie}@postgres:5432/${POSTGRES_DB:-lawgenie}?schema=public
      CHROMA_URL: http://chromadb:8000
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
      - ./documents:/app/documents:ro

volumes:
  postgres_data:
    external: true
    name: lawgenie-postgres-data
  chromadb_data:
    external: true
    name: chromadb_data
